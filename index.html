<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kids Matching Game</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial;
    background:linear-gradient(to bottom,#dbeafe,#fef9c3);
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#4f46e5;
}

.game{
    max-width:900px;
    margin:auto;
    background:white;
    border-radius:25px;
    padding:20px;
    box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

.top-items,
.bottom-items{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-top:20px;
}

.card{
    background:#fff;
    border:3px solid #ddd;
    border-radius:20px;
    padding:15px;
    text-align:center;
    min-height:180px;
    position:relative;
}

.card img{
    width:100px;
    height:100px;
    object-fit:contain;
}

.card h2{
    margin-top:10px;
    font-size:22px;
}

.draggable{
    cursor:grab;
}

.dropzone{
    border:3px dashed #bbb;
}

.correct{
    background:#dcfce7 !important;
    border-color:#22c55e !important;
}

.score{
    text-align:center;
    font-size:28px;
    margin-top:20px;
    color:#f59e0b;
}

.message{
    text-align:center;
    font-size:28px;
    margin-top:15px;
    color:#22c55e;
    font-weight:bold;
}

@media(max-width:700px){

.top-items,
.bottom-items{
    grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<h1>🎯 Kids Matching Game</h1>

<div class="game">

<div class="score">
⭐ Score : <span id="score">0</span>
</div>

<div class="message" id="message">
Drag Picture To Match 👇
</div>

<!-- TOP COLORED -->

<div class="top-items">

<div class="card">
<img 
src="https://cdn-icons-png.flaticon.com/512/616/616430.png"
class="draggable"
draggable="true"
id="cat"
>
<h2>🐱 Cat</h2>
</div>

<div class="card">
<img 
src="https://cdn-icons-png.flaticon.com/512/3069/3069172.png"
class="draggable"
draggable="true"
id="bee"
>
<h2>🐝 Bee</h2>
</div>

<div class="card">
<img 
src="https://cdn-icons-png.flaticon.com/512/1998/1998627.png"
class="draggable"
draggable="true"
id="fish"
>
<h2>🐟 Fish</h2>
</div>

</div>

<!-- BOTTOM MATCH -->

<div class="bottom-items">

<div class="card dropzone" data-match="cat">
<img 
src="https://cdn-icons-png.flaticon.com/512/616/616430.png"
style="filter:grayscale(100%) opacity(0.4);"
>
<h2>Match Cat</h2>
</div>

<div class="card dropzone" data-match="bee">
<img 
src="https://cdn-icons-png.flaticon.com/512/3069/3069172.png"
style="filter:grayscale(100%) opacity(0.4);"
>
<h2>Match Bee</h2>
</div>

<div class="card dropzone" data-match="fish">
<img 
src="https://cdn-icons-png.flaticon.com/512/1998/1998627.png"
style="filter:grayscale(100%) opacity(0.4);"
>
<h2>Match Fish</h2>
</div>

</div>

</div>

<script>

let score = 0;

const draggables =
document.querySelectorAll(".draggable");

const dropzones =
document.querySelectorAll(".dropzone");

/* VOICE */

function speak(text){

    window.speechSynthesis.cancel();

    let speech =
    new SpeechSynthesisUtterance(text);

    speech.lang = "en-US";
    speech.rate = 0.9;

    window.speechSynthesis.speak(speech);

}

/* DESKTOP DRAG */

draggables.forEach(item=>{

    item.addEventListener("dragstart", e=>{

        e.dataTransfer.setData(
            "text",
            item.id
        );

    });

});

/* DROP */

dropzones.forEach(zone=>{

    zone.addEventListener("dragover", e=>{

        e.preventDefault();

    });

    zone.addEventListener("drop", e=>{

        e.preventDefault();

        const draggedId =
        e.dataTransfer.getData("text");

        checkMatch(draggedId, zone);

    });

});

/* MOBILE TOUCH SUPPORT */

let selectedItem = null;

draggables.forEach(item=>{

    item.addEventListener("touchstart", ()=>{

        selectedItem = item.id;

        item.style.transform = "scale(1.2)";

    });

    item.addEventListener("touchend", ()=>{

        item.style.transform = "scale(1)";

    });

});

dropzones.forEach(zone=>{

    zone.addEventListener("touchstart", ()=>{

        if(selectedItem){

            checkMatch(selectedItem, zone);

        }

    });

});

/* CHECK MATCH */

function checkMatch(draggedId, zone){

    const match =
    zone.getAttribute("data-match");

    if(draggedId === match){

        zone.classList.add("correct");

        score++;

        document.getElementById("score")
        .innerText = score;

        speak("Correct");

        document.getElementById("message")
        .innerHTML = "🎉 Great Job!";

        const dragged =
        document.getElementById(draggedId);

        dragged.style.opacity = "0.3";

        dragged.draggable = false;

        dragged.style.pointerEvents = "none";

        if(score === 3){

            speak("Excellent Work");

            document.getElementById("message")
            .innerHTML =
            "🏆 You Completed The Game!";

        }

    }else{

        speak("Wrong Match");

        document.getElementById("message")
        .innerHTML =
        "❌ Try Again";

    }

}

</script>

</body>
  </html>
